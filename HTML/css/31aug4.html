<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary text-light fs-5">
  <div class="container w-50 mt-4">
    <form>
      <!-- Username -->
      <div class="mt-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter Username">
      </div>

      <!-- Password -->
      <div class="mt-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password">
      </div>

      <!-- Address -->
      <div class="mt-3">
        <label for="address" class="form-label">Address</label>
        <textarea id="address" name="address" class="form-control" rows="3" placeholder="Write your address here"></textarea>
      </div>

      <!-- Hobbies -->
      <div class="mt-3">
        <label class="form-label">Hobbies</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobby1" name="hobbies" value="sports">
          <label class="form-check-label" for="hobby1">sports</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobby2" name="hobbies" value="music">
          <label class="form-check-label" for="hobby2">music</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="hobby3" name="hobbies" value="travel">
          <label class="form-check-label" for="hobby3">travel</label>
        </div>
      </div>

      <!-- Gender -->
      <div class="mt-3">
        <label class="form-label">Gender</label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="male" name="gender" value="male">
          <label class="form-check-label" for="male">male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="female" name="gender" value="female">
          <label class="form-check-label" for="female">female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="others" name="gender" value="others">
          <label class="form-check-label" for="others">others</label>
        </div>
      </div>

      <!-- Qualifications -->
      <div class="mt-3">
        <label for="qualification" class="form-label">Qualifications</label>
        <select id="qualification" name="qualification" class="form-select">
          <option selected>Open this select menu</option>
          <option value="DBA">DBA</option>
          <option value="BCA">BCA</option>
          <option value="BTECH">BTECH</option>
        </select>
      </div>

      <!-- Submit & Reset -->
      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-danger ms-2">Reset</button>
      </div>
    </form>
  </div>
</body>
</html>
