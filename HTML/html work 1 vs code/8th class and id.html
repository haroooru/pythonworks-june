<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Colors</title>

    <style>
        #red {
            background-color: red;
            height: 200px;
        }

        .yellow {
            background-color: yellow;
            height: 200px;
        }

        #green {
            background-color: green;
            height: 200px;
        }

        .orange {
            background-color: orange;
            height: 200px;
        }
    </style>
</head>

<body>

    <div id="red"></div>

    <div class="yellow"></div>

    <div id="green"></div>

    <div class="orange"></div>

</body>
</html>
