<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>

    <style>
        table {
            border: 2px solid black;
            width: 700px;
            text-align: center;
            /* no border-collapse → double lines */
        }
        th, td {
            border: 2px solid black;
            height: 60px;   /* row height */
            padding: 10px;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th colspan="6">TIME TABLE</th>
        </tr>
        <tr>
            <th>Hours</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
        </tr>
        <tr>
            <td rowspan="5">Hours</td>
            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>

            <td>Arts</td>
        </tr>
