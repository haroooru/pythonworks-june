<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Example</title>
    <style>
        body{
            background-image:url('mazzy.jpeg'); /* set background image */
            background-repeat:no-repeat;        /* stop tiling */
            background-size:contain;            /* fit whole image */
            background-position:center;         /* keep image centered */
            margin:0;
            height:100vh; /* full screen height */
            display:flex;
            justify-content:center; /* center horizontally */
            align-items:center;     /* center vertically */
        }
        .box{
            background-color:red;
            opacity:0.7; /* transparent effect */
            padding:30px;
            width:60%;
            border-radius:10px;
            text-align:center;
        }
        h1{
            color:white;
            margin-bottom:10px;
        }
        h2{
            color:white;
            margin-bottom:10px;
        }
        p{
            color:white;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>A title here</h1>
        <h2>Sub Heading here</h2>
        <p>This is a sample  writhshbuvsyv uuuh ubuv</p>
    </div>
</body>
</html>
