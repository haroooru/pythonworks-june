<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border:5px solid red;
            width:50%;
            border-radius:5px;
            margin-right:auto; /* margin:auto is used to center elements horizontally */
            margin-left:auto;  /* when both left and right are auto, the block is centered */
            /* margin - all sides
               for specific sides we use margin-left, margin-right,
               margin-top, margin-bottom
               margin:auto → centers block elements horizontally */
        }
        /* h1{
            border-top:2px solid blue;
            border-bottom:2px solid blue;
        } */
    </style>
</head>
<body>
    <h1>Margin-Property</h1>
    <div>
        Hello
    </div>
</body>
</html>
