<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Place</th>
        </tr>
        <tr>
            <td>Arun</td>
            <td>23</td>
            <td>Ekm</td>
        </tr>
        <tr>
            <td>Amal</td>
            <td>24</td>
            <td>Tvm</td>
        </tr>
    </table>
</body>
</html>
