<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Example</title>
    <style>
        h1{
            color:red;
        }
        body{
            /* background-color:bisque; */
            background-image:url('mazzy.jpeg'); /* sets image as background */
            background-repeat:no-repeat; /* stops repeating */
            background-size:cover; /* makes image cover full screen */
        
            background-position:center; /* keeps image centered */
            background-position: cover; /* makes image cover full screen */

        }
        div{
            background-color:red;
            height:400px;
            width:00px;
            opacity:50%; /* makes the div transparent */
        }

    </style>
</head>
<body>
    <h1>Background Property</h1>
    <div>
        <h1>hello</h1>
        <h2>world</h2>
        <h3>hello</h3>
    </div>
</body>
</html>
