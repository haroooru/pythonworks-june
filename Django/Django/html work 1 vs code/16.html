<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER INFO</title>
</head>
<body style="background-color:lightpink;">
    <form>
    <h1>Enter your personal details below</h1>
    <label><b>Name:</b></label>
    <input type="text"><br> <br> <br>

    <label><b>Address</b></label>
    <textarea>
        Write your address here:
    </textarea> <br> <br> <br>

    <label><b>City</b></label>
    <input type="text">
    <label><b>State</b></label>
    <input type="text"><br> <br> <br>

    <label><b>Country:</b></label>
    <select>
        <option><b>India</b></option>
        <option><b>Russia</b></option>
        <option><b>China</b></option>
        <option><b>japan</b></option>                        

    </select>
    <label><b>Postal Code</b></label>
    <input type="text"><br> <br> <br>

    <label><b>E-mail Address</b></label>
    <input type="text"><br> <br> <br>

    <label><b>Gender</b></label>
    <input type="radio">Male
    <input type="radio">Female
    <input type="radio">Other<br> <br> <br>

    <label><b>Specify your interest</b></label>
    <input type="checkbox">Sports
    <input type="checkbox">Movies
    <input type="checkbox">Puzzles
    <input type="checkbox">Jogging
    <input type="checkbox">Swimming
    <input type="checkbox">Surfing the net
    <input type="checkbox">Others<br> <br> <br>


    <label><b>Seen any good website ? write them down</b></label>
    <textarea style="width: 100px;height: 100px;">
        Enter the website you like 
    </textarea><br> <br> <br>

    <label><b>Please rate my website</b></label>
    <input type="radio">It's great
    <input type="radio">It's good
    <input type="radio">It's fair
    <input type="radio">It's poor<br> <br> <br>

    <label><b>THANKS FOR VISITING!</b></label>
    <input type="submit">
    <input type="reset" value="Start again">
    </form>
</body>
</html>
