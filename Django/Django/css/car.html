<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD</title>
    <style>
        .card{
            border: 2px solid bisque;
            height: 500px;
            width: 400px;

        }
        .card_header{
            text-align: center;
            color: black;
            background-color: gray;
            padding: 10px;
            
        }
        h1{
            font-size: 20px;
            text-align: center;
            color: antiquewhite;

        }
        .a{
            color: antiquewhite;
            font-size: 17px;
        }
        button{
            color:red;
            font-size: 18px;
        }
        .card_button{
            display: flex;
            justify-content: center;
        }
    </style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="card">
<div class="card_header">OUTLANDER</div>
<div class="card_img"><img src="car1.jpeg" alt="Outlander" width="400px"></div>
<div class="card_body">
    <h1>Starting at $24,895</h1>
    <ul type="none">
        <li class="a"><i class="fa-solid fa-bookmark" style="color: brown;"></i>5/7 Seater</li>
        <li class="a"><i class="fa-solid fa-bookmark" style="color: brown;"></i>Q series</li>
        <li class="a"><i class="fa-solid fa-bookmark" style="color: brown;"></i>Petrol</li>
        <li class="a"><i class="fa-solid fa-bookmark" style="color: brown;"></i>Automatic</li>
    </ul>
</div>
<div class="card_button"><button >Learn more>></button></div>
    </div>
</body>
</html>
